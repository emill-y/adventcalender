<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eisha's Advent Calendar</title>
  <meta name="description" content="24 little doors of holiday joy." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6 L92 90 H8Z' fill='%23b9763f'/><path d='M50 6 L92 90' stroke='white' stroke-width='9' stroke-linecap='round'/><path d='M50 6 L8 90' stroke='white' stroke-width='9' stroke-linecap='round'/><circle cx='50' cy='10' r='9' fill='%23c94a4a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- shared paint filters for every illustration -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="wc-soft" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="1.4" />
      </filter>
    </defs>
  </svg>

  <div class="snow" aria-hidden="true"></div>

  <header class="top">
    <svg class="garland" aria-hidden="true"></svg>
    <p class="eyebrow">December 2026</p>
    <h1>Eisha’s <em>Advent</em> Calendar</h1>
    <p class="sub">24 little doors of joy. Open one each day.</p>
    <p class="status" id="status"></p>
  </header>

  <main>
    <div class="calendar" id="calendar" role="group" aria-label="Advent calendar drawers"></div>
    <div class="footer-bar">
      <p class="progress" id="progress"></p>
      <button class="link-btn" id="reset" type="button">close all the doors</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="gift" aria-labelledby="gift-title">
    <article class="tag">
      <button class="close" type="button" aria-label="Close">&times;</button>
      <div class="ribbon" aria-hidden="true"></div>
      <div class="tag-art" id="gift-art"></div>
      <p class="tag-day" id="gift-day"></p>
      <span class="tag-kind" id="gift-kind"></span>
      <h2 class="tag-title" id="gift-title"></h2>
      <p class="tag-artist" id="gift-artist"></p>
      <p class="tag-text" id="gift-text"></p>
      <div class="tag-actions">
        <a class="btn" id="gift-action" target="_blank" rel="noopener"></a>
        <button class="btn ghost" id="gift-did" type="button" aria-pressed="false"></button>
      </div>
    </article>
  </dialog>

  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
