<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eisha's Advent Calendar</title>
  <meta name="description" content="24 little doors of holiday joy." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6 L92 90 H8Z' fill='%23b9763f'/><path d='M50 6 L92 90' stroke='white' stroke-width='9' stroke-linecap='round'/><path d='M50 6 L8 90' stroke='white' stroke-width='9' stroke-linecap='round'/><circle cx='50' cy='10' r='9' fill='%23c94a4a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- shared paint filters for every illustration -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="wc-soft" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" />
        <feGaussianBlur stdDeviation="1.4" />
      </filter>
    </defs>
  </svg>

  <div class="snow" aria-hidden="true"></div>

  <header class="top">
    <svg class="garland" aria-hidden="true"></svg>
    <p class="eyebrow">December 2026</p>
    <h1>Eisha’s <em>Advent</em> Calendar</h1>
    <p class="status" id="status"></p>
  </header>

  <main>
    <div class="calendar" id="calendar" role="group" aria-label="Advent calendar drawers"></div>
    <div class="footer-bar">
      <p class="progress" id="progress"></p>
      <button class="link-btn" id="reset" type="button">close all the doors</button>
    </div>

    <section class="family">
      <svg class="family-bow" viewBox="0 0 60 34" aria-hidden="true"><path d="M30 17 C14 0 2 6 8 16 C12 24 24 20 30 17 C36 20 48 24 52 16 C58 6 46 0 30 17Z" fill="#c94a4a" stroke="#8f2f2f" stroke-width="1.5"/><path d="M30 17 l-9 16 M30 17 l9 16" stroke="#c94a4a" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="17" r="5" fill="#a8383a"/></svg>
      <h2>Tuck a gift behind a door</h2>
      <p>Family &amp; friends: add your own little surprise for Eisha. It stays hidden until its door opens.</p>
      <button class="btn" id="add-gift" type="button">Add a gift ♡</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="gift" aria-labelledby="gift-title">
    <article class="tag">
      <button class="close" type="button" aria-label="Close">&times;</button>
      <div class="ribbon" aria-hidden="true"></div>
      <div class="tag-art" id="gift-art"></div>
      <p class="tag-day" id="gift-day"></p>
      <span class="tag-kind" id="gift-kind"></span>
      <h2 class="tag-title" id="gift-title"></h2>
      <p class="tag-artist" id="gift-artist"></p>
      <p class="tag-text" id="gift-text"></p>
      <div class="family-notes" id="family-notes"></div>
      <div class="tag-actions">
        <a class="btn" id="gift-action" target="_blank" rel="noopener"></a>
        <button class="btn ghost" id="gift-did" type="button" aria-pressed="false"></button>
      </div>
    </article>
  </dialog>

  <dialog id="giver" aria-labelledby="giver-title">
    <article class="tag form-tag">
      <button class="close" type="button" aria-label="Close">&times;</button>
      <div class="ribbon" aria-hidden="true"></div>

      <form id="gift-form" class="step" novalidate>
        <p class="tag-day">a gift for Eisha</p>
        <h2 class="tag-title" id="giver-title">Tuck something behind a door</h2>

        <label>Who's it from?
          <input name="from" maxlength="40" placeholder="Mom &amp; Dad" required />
        </label>

        <div class="row">
          <label>Which door?
            <select name="day">
              <option value="any">Surprise me (any door)</option>
            </select>
          </label>
          <label>What is it?
            <select name="kind">
              <option value="note">A sweet note</option>
              <option value="treat">A little treat</option>
              <option value="song">A song</option>
              <option value="plan">A plan together</option>
            </select>
          </label>
        </div>

        <label>Title
          <input name="title" maxlength="80" placeholder="Hot cocoa date with us!" required />
        </label>
        <label>Your message
          <textarea name="text" maxlength="600" rows="4" placeholder="We're so proud of you. This one's on us…"></textarea>
        </label>
        <label>Link <span class="opt">(optional: a song, a recipe, a gift card…)</span>
          <input name="link" type="url" maxlength="400" placeholder="https://open.spotify.com/…" />
        </label>

        <p class="form-err" id="form-err" role="alert"></p>
        <div class="tag-actions"><button class="btn" type="submit" id="wrap-btn">Wrap it up 🎁</button></div>
      </form>

      <div class="step" id="saved-step" hidden>
        <div class="wrapped" aria-hidden="true"></div>
        <p class="tag-day">all tucked in!</p>
        <h2 class="tag-title">Your gift is in the calendar</h2>
        <p class="tag-text" id="saved-text"></p>
        <div class="tag-actions"><button class="btn ghost" id="saved-another" type="button">Add another gift</button></div>
      </div>

    </article>
  </dialog>

  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
